<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickFlow: tasks, habits, learning resources and time-boxed plans in one personal productivity dashboard." />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)" />
    <title>QuickFlow</title>
    <!-- apply the saved theme (Settings > Appearance) before the first paint, so there is no flash -->
    <script>try { var t = localStorage.getItem('quickflow-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
